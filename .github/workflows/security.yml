name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Terraform の設定ミス（IaC）スキャン。初回はノイズが多いため report-only（exit 0）で
  # Security タブに SARIF を上げる。トリアージ後に exit-code 1 で gate 化できる。
  trivy-iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      # Dependabot/fork PR は GITHUB_TOKEN が read-only に強制され security-events: write が
      # 無効化されるため、push か「同一リポジトリ発の非 Dependabot PR」のときだけ upload する。
      - uses: github/codeql-action/upload-sarif@v4
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        with:
          sarif_file: trivy-iac.sarif
