# STG（自宅サーバー）へのキャラクター基盤スタック（PostgreSQL + migrate + API）デプロイ。
# 中央プラットフォームが character-db-net を作成し DB/API を起動する（旧 db-infra + api-infra の
# 2 スタックを1つに統合）。アプリ(Next.js)スタックは別 deploy-stg で character-db-net に参加する。
# 前提: self-hosted runner ラベル character-stg、$STG_ROOT/repositories 配下に ys-infrastructure と
#       apis/ys-character-api が clone 済み。
name: Deploy STG (home)

# STG は `staging` ブランチの鏡。develop マージでは STG を触らない。staging へ promote するか
# 手動（workflow_dispatch）でデプロイ。runner オフライン時は queue → online で消化。
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: stg-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, character-stg]
    steps:
      - name: Pull & up (PostgreSQL + migrate + API)
        env:
          STG_ROOT: ${{ vars.STG_ROOT }}
        run: |
          set -e
          ROOT="${STG_ROOT:-$HOME/character-system}"
          # API 本体（ビルド元：schema/migrations/Dockerfile を所有）と ys-infrastructure を staging に最新化。
          git -C "$ROOT/repositories/apis/ys-character-api" fetch origin staging && git -C "$ROOT/repositories/apis/ys-character-api" reset --hard origin/staging
          git -C "$ROOT/repositories/ys-infrastructure" fetch origin staging && git -C "$ROOT/repositories/ys-infrastructure" reset --hard origin/staging
          cd "$ROOT/repositories/ys-infrastructure"
          # character-db-net を作成し、Postgres → migrate（atlas→views→seeds）→ API の順に起動する。
          docker compose up -d --build

      - name: Smoke test (API /healthz が 200 を返すまで待つ)
        env:
          STG_ROOT: ${{ vars.STG_ROOT }}
        run: |
          set -e
          # STG は compose で 8080 をホストに公開。localhost で確認する。
          EP="${STG_API_ENDPOINT:-http://localhost:8080}"
          echo "endpoint: $EP"
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$EP/healthz" || true)
            if [ "$code" = "200" ]; then echo "healthz OK"; exit 0; fi
            echo "waiting healthz ($i/30): got '$code'"; sleep 5
          done
          echo "smoke test failed: /healthz が 200 を返しませんでした" >&2
          docker compose -f "$ROOT/repositories/ys-infrastructure/docker-compose.yml" logs --tail=50 || true
          exit 1
