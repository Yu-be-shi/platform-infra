# 本番(AWS)の「スイッチ」：up で一気に構築、down で全削除する使い捨て環境。
#
# - 手動実行（Actions の Run workflow）で up / down を選ぶ。
# - 毎日深夜に自動 down（消し忘れ＝課金しっぱなし防止のセーフティ）。
# - 単一 state（network + RDS + migrate + ALB + ECS）を1回の apply で構築する。
#   VPC/subnet も module.network が作るため、旧来の VPC/subnet 受け渡しや
#   「DB→API→DB 再 apply」の循環解消ダンスは不要（API↔RDS の ingress は standalone ルール）。
# - データは永続させない（ephemeral=true で RDS は削除保護無効・final snapshot 無し）。
#   up のたびに seeds で初期データ（races 等）が再投入される。
#
# 必要な Secrets / Variables（リポジトリ設定）:
#   secrets.AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  … AWS 認証
#   secrets.GH_PAT                                     … ys-character-api を checkout する PAT(repo 読み取り)
#   secrets.TF_VAR_API_KEY_SECRET_ARN                  … INTERNAL_API_KEY の Secrets Manager ARN（永続・switch 外で作成）
#   vars.AWS_REGION (任意, 既定 ap-northeast-1) / vars.CORS_ORIGINS (任意)
name: Prod Switch (AWS ephemeral)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up=構築 / down=全削除"
        type: choice
        options: [up, down]
        required: true
  schedule:
    # 毎日 03:00 JST(18:00 UTC) に自動 down。手動 up を消し忘れても課金を止める。
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: prod-switch
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  TF_DIR: terraform/environments/prod
  TF_VAR_api_key_secret_arn: ${{ secrets.TF_VAR_API_KEY_SECRET_ARN }}
  TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS || '*' }}
  TF_VAR_ephemeral: "true"

jobs:
  switch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve action（schedule は常に down）
        id: act
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "action=down" >> "$GITHUB_OUTPUT"
          else
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      # ys-infrastructure（terraform）をルートに、API 本体（Dockerfile / Dockerfile.migrate / schema）を api/ に。
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/ys-character-api
          path: api
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # ───────────────────────── UP（構築）─────────────────────────
      - name: UP - terraform apply（単一 state を一括構築）
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: UP - build & push images (api + migrate)
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e
          REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REG"
          API_ECR="$(terraform output -raw ecr_repository_url)"
          MIGRATE_ECR="$(terraform output -raw migrate_ecr_repository_url)"
          # ビルド元はどちらも ys-character-api（schema/migrations と Dockerfile を所有）。
          docker build --target runtime -t "$API_ECR:${{ github.sha }}" "$GITHUB_WORKSPACE/api"
          docker push "$API_ECR:${{ github.sha }}"
          docker build -f "$GITHUB_WORKSPACE/api/Dockerfile.migrate" -t "$MIGRATE_ECR:${{ github.sha }}" "$GITHUB_WORKSPACE/api"
          docker push "$MIGRATE_ECR:${{ github.sha }}"

      - name: UP - run DB migration (atlas → views → seeds)
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          MIGRATE_SG="$(terraform output -raw migrate_security_group_id)"
          SUBNETS="$(terraform output -json private_subnet_ids | jq -r 'join(",")')"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition character-db-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$MIGRATE_SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT_CODE" = "0" ] || { echo "migration failed (exit $EXIT_CODE)"; exit 1; }

      - name: UP - redeploy API with latest image
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          SERVICE="$(terraform output -raw ecs_service_name)"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: UP - smoke test (ALB /healthz が 200 を返すまで待つ)
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e
          EP="$(terraform output -raw api_endpoint)"
          echo "endpoint: $EP"
          for i in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$EP/healthz" || true)
            if [ "$code" = "200" ]; then echo "healthz OK"; exit 0; fi
            echo "waiting healthz ($i/20): got '$code'"; sleep 10
          done
          echo "smoke test failed: /healthz が 200 を返しませんでした" >&2
          exit 1

      - name: UP - summary
        if: steps.act.outputs.action == 'up'
        working-directory: ${{ env.TF_DIR }}
        run: terraform output || true

      # ───────────────────────── DOWN（全削除）─────────────────────────
      # 単一 state なので一括 destroy。API キー Secret は switch 外（永続）なので残る。
      - name: DOWN - terraform destroy（一括削除）
        if: steps.act.outputs.action == 'down'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform destroy -auto-approve
