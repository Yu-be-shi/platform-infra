# ローカル・CI 用: キャラクター基盤スタック（PostgreSQL + マイグレーション + API + Redis）。
# 中央プラットフォームが character-db-net を作成し、DB と API を起動する所有者。
# アプリ(Next.js)スタックはこの character-db-net に external 接続する。
#
# 前提レイアウト（repositories/ 配下）:
#   repositories/
#   ├── apis/ys-character-api/   (API 本体 + schema/migrations + Dockerfile / Dockerfile.migrate)
#   └── ys-infrastructure/       (このファイル)
#
# 起動: docker compose up --build -d

services:
  # キャラクター DB（PostgreSQL）。スキーマ適用は character-db-migrate が行うため素の公式イメージ。
  character-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CHAR_DB_NAME:-characters}
      POSTGRES_USER: ${CHAR_DB_USER:-app}
      POSTGRES_PASSWORD: ${CHAR_DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAR_DB_USER:-app} -d ${CHAR_DB_NAME:-characters}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - character-db-data:/var/lib/postgresql/data
    networks:
      - character-db-net

  # マイグレーション（atlas apply → views → seeds）。schema/migrations を所有する
  # ys-character-api の Dockerfile.migrate からビルドする。
  character-db-migrate:
    build:
      context: ../apis/ys-character-api
      dockerfile: Dockerfile.migrate
    command:
      - "--url=postgres://${CHAR_DB_USER:-app}:${CHAR_DB_PASSWORD:-devpassword}@character-db:5432/${CHAR_DB_NAME:-characters}?sslmode=disable"
    depends_on:
      character-db:
        condition: service_healthy
    restart: "no"
    networks:
      - character-db-net

  character-api:
    build:
      context: ../apis/ys-character-api
      dockerfile: Dockerfile
      target: runtime
    environment:
      DB_DSN: "host=character-db user=${CHAR_DB_USER:-app} password=${CHAR_DB_PASSWORD:-devpassword} dbname=${CHAR_DB_NAME:-characters} port=5432 sslmode=disable TimeZone=UTC"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-api-key}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 冪等性キー用 Redis（このサービス専有）。未設定なら冪等性機能は無効。
      REDIS_ADDR: ${REDIS_ADDR:-character-api-redis:6379}
    ports:
      - "8080:8080"
    depends_on:
      character-db:
        condition: service_healthy
      character-db-migrate:
        condition: service_completed_successfully
      character-api-redis:
        condition: service_healthy
    networks:
      - character-db-net

  # character-api 専有の Redis（冪等キーの重複排除ストア）。共有 DB とは別の private ストア。
  character-api-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - character-db-net

volumes:
  character-db-data:

# 中央が character-db-net を作成する（external ではない）。他スタックは external で参加。
networks:
  character-db-net:
    name: character-db-net
